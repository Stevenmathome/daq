# DAQ Rev B panel configuration.
# Edit this file, then rebuild. A pre-build script checks it and writes
# include/config_gen.h. The Teensy does not parse YAML.
#
# Quote thermocouple types. YAML treats yes, no, on, and off as booleans,
# and some parsers do the same with the bare letters T, Y, and N.

version: 1

# USB CSV rows per second. 0 starts quiet until a STREAM command.
# Load cells only produce a new sample at 10 Hz (RATE pin is tied to GND).
stream_hz: 10

# How long a button or the E-stop sense must hold before it counts.
debounce_ms: 25

# Every analog channel is the same line: value = slope * raw + offset.
# An optional points table replaces that line. See the README for the
# bench commands and for how EEPROM and this file interact.
#
# raw means:
#   load cell      HX711 counts
#   pressure       sensor volts, before the 10k/20k divider
#   thermocouple   MAX31856 degC, so slope 1 offset 0 leaves the chip alone
#
# Two-point line, either from a datasheet or from two bench readings:
#   slope  = (value1 - value0) / (raw1 - raw0)
#   offset = value0 - slope * raw0
# 0.5 V = 0 PSI and 4.5 V = 100 PSI is slope 25, offset -12.5.
# A load cell, unloaded counts Z and counts L at weight W:
#   slope = W / (L - Z),  offset = -slope * Z
# A negative slope flips a cell whose green and white wires are swapped.
#
# Optional points: [[raw, value], ...] with 2 to 8 rows. Raw must increase.
# Values must be strictly increasing or strictly decreasing. The table
# replaces slope and offset. Outside the ends, the end segment is extended.
#
# The tare button is not this offset. It subtracts the live reading until
# reboot and is not written here or to EEPROM.
load_cells:
  - {id: LC1, name: Specimen 1, slope: 1, offset: 0, unit: raw}
  - {id: LC2, name: Specimen 2, slope: 1, offset: 0, unit: raw}
  - {id: LC3, name: Specimen 3, slope: 1, offset: 0, unit: raw}

# 0.5-4.5 V, 0-100 PSI. slope = 100 / (4.5 - 0.5) = 25, offset = -25 * 0.5.
pressures:
  - {id: PT1, name: Pressure 1, slope: 25, offset: -12.5, unit: psi}
  - {id: PT2, name: Pressure 2, slope: 25, offset: -12.5, unit: psi}
  - {id: PT3, name: Pressure 3, slope: 25, offset: -12.5, unit: psi}
  - {id: PT4, name: Pressure 4, slope: 25, offset: -12.5, unit: psi}
  - {id: PT5, name: Pressure 5, slope: 25, offset: -12.5, unit: psi}
  - {id: PT6, name: Pressure 6, slope: 25, offset: -12.5, unit: psi}

# Silkscreen is pin 1 blue, pin 2 red (ANSI type T: blue positive, red
# negative). Change the letter if the junction is not T. slope 1 offset 0
# is no extra correction.
thermocouples:
  - {id: TC1, name: Temp 1, type: "T", slope: 1, offset: 0, unit: C}
  - {id: TC2, name: Temp 2, type: "T", slope: 1, offset: 0, unit: C}
  - {id: TC3, name: Temp 3, type: "T", slope: 1, offset: 0, unit: C}

# Display 1, display 2, display 3. The page button cycles this list.
# Channel order is fixed: one reading per display.
pages:
  - {name: Load, show: [LC1, LC2, LC3]}
  - {name: Pressure, show: [PT1, PT2, PT3]}
  - {name: Pressure 2, show: [PT4, PT5, PT6]}
  - {name: Temperature, show: [TC1, TC2, TC3]}

# Eight headers, each exactly once. action: none leaves a header unused.
# active high means the contact closes to +3V3 (the board pulldown makes
# an open contact read low).
#
# There are eight inputs and seven valve outputs, so not every valve gets
# a button. Valves 5, 6, and the extra 12 V output (valve 7) are serial
# commands only, and they still obey the arm interlock and the E-stop.
inputs:
  - {id: DI1, name: Arm, action: arm, active: high}
  - {id: DI2, name: Valve 1, action: toggle_valve, valve: 1, active: high}
  - {id: DI3, name: Valve 2, action: toggle_valve, valve: 2, active: high}
  - {id: DI4, name: Valve 3, action: momentary_valve, valve: 3, active: high}
  - {id: DI5, name: Tare, action: tare, channels: [LC1, LC2, LC3], active: high}
  - {id: DI6, name: Page, action: display_page, active: high}
  - {id: DI7, name: Reset, action: reset, active: high}
  - {id: DI8, name: Valve 4, action: toggle_valve, valve: 4, active: high}

# E-stop sense. The pin is not fixed on the Rev B schematic; set it to the
# GPIO you actually wire. Free pins: 10, 14, 39, 40, 41.
#
# This example uses pin 10, pulldown, active low:
#   normally-closed switch from the pin to +3V3.
#   Pressed, or the wire falls off -> the pin goes low -> latch.
# An unwired pin 10 therefore reads tripped and the valves stay latched.
# That is the safe bench state. Tie the pin to +3V3 if you need the valves
# before the switch exists.
#
# The mushroom's power contact is separate. It must open 12 V to the
# solenoid coils only. Do not put it in series with J16, or the Teensy
# and the logger die with the valves. See the README wiring notes.
#
# reset is the input that clears the latch, and only after this sense has
# released. A reset that arrives while the line is still tripped is ignored.
estop:
  pin: 10
  active: low
  pull: down
  reset: DI7

# A valve turns on only while every interlock that names it is satisfied
# and the E-stop latch is clear. Arm dropping clears a toggle, so the
# valve does not come back by itself when you arm again.
interlocks:
  - {valve: 1, requires: DI1}
  - {valve: 2, requires: DI1}
  - {valve: 3, requires: DI1}
  - {valve: 4, requires: DI1}
  - {valve: 5, requires: DI1}
  - {valve: 6, requires: DI1}
  - {valve: 7, requires: DI1}
