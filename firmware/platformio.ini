; DAQ Rev B — Teensy 4.1 firmware
; Build: pio run -e teensy41
; Upload (12 V must be on, VIN-VUSB pad cut): pio run -e teensy41 -t upload

[env:teensy41]
platform = teensy
board = teensy41
framework = arduino
monitor_speed = 115200
extra_scripts = pre:scripts/gen_config.py
build_flags =
    -DUSB_SERIAL
    -Wall
    -Wextra
    -Wno-unused-parameter
